[project]
name = "multi-source-knowledge-graph"
version = "0.1.0"
description = "CocoIndex Plus example: one Neo4j knowledge graph from a Postgres component catalog, a folder of Markdown docs, and GitHub issues, pull requests, and releases; entity and person nodes are shared components held by every source that knows them."
requires-python = ">=3.11"
dependencies = [
    "cocoindex-plus[neo4j]>=1.0.47",
    "aiohttp",
    "asyncpg",
]

[tool.setuptools]
py-modules = ["main", "records", "catalog", "graph"]
packages = ["sources"]

[tool.uv.sources]
cocoindex-plus = { index = "keygen" }

[[tool.uv.index]]
name = "keygen"
explicit = true

# You need to set the following environment variable to use the Keygen index:
# - UV_INDEX_KEYGEN_USERNAME=token
# - UV_INDEX_KEYGEN_PASSWORD=<your-installation-token>
url = "https://pypi.pkg.keygen.sh/cocoindex-io/simple"
cache-control = { api = "no-cache" }
