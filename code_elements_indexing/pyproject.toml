[project]
name = "code-elements-indexing"
version = "0.1.0"
description = "Example for CocoIndex: extract and index code declarations and references from a GitHub repository."
requires-python = ">=3.11"
dependencies = [
    "cocoindex-plus[github,postgres]>=1.0.1",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.31",
]

[tool.setuptools]
packages = []

[tool.uv.sources]
cocoindex-plus = { index = "keygen" }

[[tool.uv.index]]
name = "keygen"
explicit = true

# You need to set the following environment variable to use the Keygen index:
# - UV_INDEX_KEYGEN_USERNAME=token
# - UV_INDEX_KEYGEN_PASSWORD=<your-installation-token>
url = "https://pypi.pkg.keygen.sh/cocoindex-io/simple"
cache-control = { api = "no-cache" }
